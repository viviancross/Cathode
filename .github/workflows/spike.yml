name: spike

# Runs the Cathode 4 stack spike (spike/spike.py) on every desktop target and
# uploads the frame it composed, so each OS can be checked by eye.
on:
  push:
    paths: ["spike/**", ".github/workflows/spike.yml"]
  workflow_dispatch:

jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pygame-ce mpv PyOpenGL Pillow

      - name: libmpv (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libmpv2 xvfb libgl1-mesa-dri
      - name: libmpv (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install mpv
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"
      - name: libmpv (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          url=$(curl -s https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest \
            | python -c "import sys,json; print(next(a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if a['name'].startswith('mpv-dev-x86_64-2')))")
          curl -sL -o mpv-dev.7z "$url"
          7z x -y -o_libmpv mpv-dev.7z > /dev/null
      # The runner has no GPU and Windows' own OpenGL stops at 1.1; Mesa's
      # software OpenGL beside python.exe takes precedence over the system one.
      - name: software OpenGL (Windows CI only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          url=$(curl -s https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest \
            | python -c "import sys,json; print(next(a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if 'release-msvc' in a['name']))")
          curl -sL -o mesa.7z "$url"
          7z e -y mesa.7z "x64/*.dll" -o"$pythonLocation" > /dev/null
          ls "$pythonLocation"/*.dll

      - name: run spike
        shell: bash
        run: |
          set -o pipefail
          mkdir -p spike/out
          # Static SMPTE bars, so the frame the check samples doesn't depend on timing.
          cmd="python spike/spike.py --seconds 8 --crt --pip --check --shot spike/out/${{ matrix.os }}.png --source av://lavfi:smptebars=size=1280x720:rate=30"
          if [ "$RUNNER_OS" = Linux ]; then cmd="xvfb-run -s '-screen 0 1280x720x24' $cmd"; fi
          rc=0
          eval "$cmd" 2>&1 | grep -v numpy | tee spike/out/log.txt || rc=1
          # A plain pass too (no CRT, no PiP), so a failure can be pinned to a layer.
          eval "${cmd/--crt --pip /}" 2>&1 | grep -v numpy | tee -a spike/out/log.txt || rc=1
          exit $rc
      # Job logs need a GitHub sign-in to read; summaries and annotations don't.
      - name: publish output
        if: always()
        shell: bash
        run: |
          { echo '```'; tail -40 spike/out/log.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          msg=$(python -c "
          noise = ('Loaded extension', 'Loading hwdec', 'Loading failed', 'ALSA lib', 'hwdec only works', 'not a libplacebo')
          t = ''.join(l for l in open('spike/out/log.txt', errors='replace') if not any(n in l for n in noise))[-20000:]
          print(t.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))")
          echo "::notice title=spike ${{ matrix.os }}::$msg"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-${{ matrix.os }}
          path: spike/out/
